name: R214 authentic Blender preview transfer
on:
  push:
    branches: [task/SYN_REACTOR_R214_VISUAL_PROOF_20261029]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Decode previously captured JPEG without modification
        run: |
          python3 - <<'PY'
          import re,base64,pathlib,hashlib
          p=pathlib.Path('reactor-decor/r214-visual-preview.svg')
          s=p.read_text()
          m=re.search(r'data:image/jpeg;base64,([A-Za-z0-9+/=]+)',s)
          assert m, 'MISSING_JPEG_PAYLOAD'
          b=base64.b64decode(m.group(1),validate=True)
          assert b.startswith(bytes.fromhex('ffd8ff')) and b.endswith(bytes.fromhex('ffd9'))
          dest=pathlib.Path('reactor-decor/r214-real-blender-preview.jpg')
          dest.write_bytes(b)
          print('R214_IMAGE_SHA256',hashlib.sha256(b).hexdigest(),'bytes',len(b))
          PY
      - name: Transfer authenticated visual artifact
        uses: actions/upload-artifact@v4
        with:
          name: synestra-r214-real-blender-preview
          path: reactor-decor/r214-real-blender-preview.jpg
          retention-days: 3
