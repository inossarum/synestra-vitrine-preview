name: R205 adaptive GPU budget – isolated preview build
on:
  push:
    branches:
      - task/SYN_SITEFORGE_R205_ADAPTIVE_GPU_20261029
  pull_request:
    branches:
      - task/SYN_SITEFORGE_R204_LIGHTWEIGHT_CORE_20261029
permissions:
  contents: read
concurrency:
  group: synestra-r205-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: r204-build/package-lock.json
      - name: Exact pinned local dependencies
        run: npm --prefix r204-build ci --ignore-scripts --no-audit --no-fund
      - name: Build one renderer (R188.1 LAB source unchanged)
        run: node r204-build/build.mjs
      - name: Failure-first R204 and R205 controls
        run: |
          node --check r204-build/scene.mjs
          node --check r204-build/adaptive-tier.mjs
          node --check assets/r204-scene.bundle.mjs
          node --test tests/siteforge_r204_core.test.mjs tests/siteforge_r205_adaptive_tier.test.mjs
      - name: Isolated R205 static export (not deploy)
        env:
          CF_PAGES_BRANCH: task/SYN_SITEFORGE_R205_ADAPTIVE_GPU_20261029
        run: |
          node tools/build_vitrine_static.mjs
          node -e "const fs=require('fs');for(const p of ['dist/index.html','dist/assets/r204-scene.bundle.mjs','dist/assets/r204-hero.css','dist/assets/r204-gpu-benchmarks/d-nvidia.json','dist/connect/index.html','dist/bridge/index.html','dist/siteforge/index.html','dist/offres/index.html'])if(!fs.existsSync(p))throw Error('MISSING '+p);if(!fs.readFileSync('dist/index.html','utf8').includes('syn-r204-home'))throw Error('R205_CORE_NOT_EXPORTED');"
      - name: Reviewable artifact only; no Cloudflare deploy
        uses: actions/upload-artifact@v4
        with:
          name: synestra-r205-private-candidate
          path: dist/
          retention-days: 3
