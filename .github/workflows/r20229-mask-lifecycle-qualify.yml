# R202.29 isolated lifecycle fix; immutable 80-face parent. No deployment.
name: R202.29 faceted depth mask lifecycle
on:
  push:
    branches:
      - task/SYN_LAB_R20229_MASK_LIFECYCLE_20261101
    paths:
      - .github/workflows/r20229-mask-lifecycle-qualify.yml
      - lab-babylon/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20229-mask-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: lab-babylon
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab-babylon/package-lock.json
      - name: Validate isolated source and unchanged 80-facet nucleus
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          grep -q "CreateIcoSphere('central nucleus',{radius:.38,subdivisions:2}" src/main.js
          grep -q "const depthMaskActive=isFacetMaskActive" src/main.js
          grep -q "front.setEnabled(enabled&&coreVisible)" src/plasma-ribbons.js
          test -f tests/r20229-core-mask-lifecycle.test.mjs
      - name: Install exact dependencies without billing
        run: npm ci --no-audit --no-fund
      - name: Full regression, failure-first and lifecycle tests
        run: npm test
      - name: Build original Babylon bundle without publishing
        run: |
          npm run build
          sha256sum dist/babylon-lab.js
      - name: Set up pinned Chrome 155 software WebGL
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: '155'
          install-dependencies: true
      - name: Native browser core power-off and depth-mask E2E
        env:
          R202_DESKTOP_ONLY: '1'
          R202_QUALITY_QA: '1'
          R202_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/r202-browser-smoke.mjs
      - name: Ensure source remains unchanged by build
        run: git diff --exit-code -- src tests
