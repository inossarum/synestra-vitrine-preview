# QA-only proposal. NOT the committed CI. Requires full source review and an authorized branch writer.
name: R202.20 PC core focus experimental exact-source qualification
on:
  push:
    branches:
      - task/SYN_LAB_R202_PLASMA_FIELD_20261030
      - task/SYN_LAB_R20219_DESKTOP_DELIVERY_20261031
      - task/SYN_LAB_R20220_CORE_FOCUS_QA_20261031
    paths:
      - .github/workflows/r202-plasma-field.yml
      - lab-babylon/src/main.js
      - lab-babylon/src/plasma-volume-r20215.js
      - lab-babylon/src/plasma-volume-policy.mjs
      - lab-babylon/src/plasma-field.js
      - lab-babylon/src/plasma-field.mjs
      - lab-babylon/src/plasma-ribbons.js
      - lab-babylon/src/geometry-frame-budget.mjs
      - lab-babylon/scripts/r202-browser-smoke.mjs
      - lab-babylon/tests/r20215-native-babylon.test.mjs
      - lab-babylon/tests/plasma-field-r202.test.mjs
      - lab-babylon/tests/geometry-frame-budget-r202.test.mjs
      - lab-babylon/tests/core-volume-integration.test.mjs
      - lab-babylon/package.json
      - lab-babylon/package-lock.json
  pull_request:
    branches:
      - task/SYN_LAB_R202_PLASMA_FIELD_20261030
      - task/SYN_LAB_R20219_DESKTOP_DELIVERY_20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synestra-r20220-core-focus-exact-source
  cancel-in-progress: false
jobs:
  desktop-exact-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: lab-babylon
    steps:
      - name: Checkout exact task commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22 with npm lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab-babylon/package-lock.json
      - name: Require complete R202.20 experimental core source in clean Git checkout
        run: |
          echo "R20220_SOURCE_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          git ls-files --error-unmatch src/main.js src/plasma-volume-r20215.js src/plasma-volume-policy.mjs tests/r20215-native-babylon.test.mjs scripts/r202-browser-smoke.mjs
          test -s src/plasma-volume-r20215.js
          test -s src/plasma-volume-policy.mjs
          grep -q 'installR20215Volume' src/main.js
          grep -q 'uCorePower' src/plasma-volume-r20215.js
          grep -q 'coreRayIntegral' src/plasma-volume-r20215.js
          grep -q 'coreForegroundT' src/plasma-volume-r20215.js
          echo 'c397b41e3fef2831b931eac2928c402815f0a6eb027db846abb1fee88b3fa12e  src/plasma-volume-r20215.js' | sha256sum --check
          git hash-object src/main.js src/plasma-volume-r20215.js src/plasma-volume-policy.mjs
      - name: Reproducible dependencies FREE_ONLY
        run: npm ci --no-audit --no-fund
      - name: Failure-first native Babylon and full unit regressions
        run: |
          node --test tests/r20215-native-babylon.test.mjs tests/plasma-field-r202.test.mjs
          npm test
      - name: Exact-source desktop build and provenance
        run: |
          npm run build
          test -s dist/babylon-lab.js
          sha256sum dist/babylon-lab.js
          echo '3c4219d192bb547d17a7716c8ffa65f2fa5b469bc915d018b2140963c83f9e0e  dist/babylon-lab.js' | sha256sum --check
          wc -c dist/babylon-lab.js
          git diff --exit-code -- src tests
      - name: Desktop-only browser policy gate
        run: |
          grep -q 'R202_DESKTOP_ONLY' scripts/r202-browser-smoke.mjs
          echo 'R202_DESKTOP_ONLY_SUPPORTED'
      - name: Chromium desktop WebGL software smoke (not RTX 3090)
        env:
          R202_DESKTOP_ONLY: '1'
          R202_QUALITY_QA: '1'
        run: node scripts/r202-browser-smoke.mjs
      - name: Preserve exact PC build checksum
        run: sha256sum dist/babylon-lab.js > R20220_CORE_FOCUS_SHA256SUMS.txt
      - name: Upload exact PC review build (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: r20220-core-focus-build
          path: |
            lab-babylon/index.html
            lab-babylon/style.css
            lab-babylon/dist/babylon-lab.js
            lab-babylon/R20220_CORE_FOCUS_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 2
      - name: Store desktop previews for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20220-core-focus-previews
          path: |
            ${{ runner.temp }}/r202-ci-1100.png
            ${{ runner.temp }}/r202-motion-*.png
            ${{ runner.temp }}/r20215-gpu-*.png
          if-no-files-found: ignore
          retention-days: 2
