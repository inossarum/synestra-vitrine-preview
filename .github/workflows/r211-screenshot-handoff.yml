name: R211 screenshot handoff
on:
  push:
    branches:
      - task/SYN_SITEFORGE_R211_REACTOR_HALL_20261029
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify images exactly
        run: |
          file evidence/R208_r211-hall-v3_1440.png evidence/R208_r211-hall-v3_390.png
          sha256sum evidence/R208_r211-hall-v3_1440.png evidence/R208_r211-hall-v3_390.png
      - name: Export two real desktop Chrome screenshots
        uses: actions/upload-artifact@v4
        with:
          name: synestra-r211-chrome-captures
          path: |
            evidence/R208_r211-hall-v3_1440.png
            evidence/R208_r211-hall-v3_390.png
          retention-days: 3
