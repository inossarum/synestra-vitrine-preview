name: R201 exact-source provenance
on:
  push:
    branches:
      - task/SYN_LAB_R201_CORE_SHELL_FUSION_20261030
    paths:
      - .github/workflows/r201-exact-source.yml
permissions:
  contents: read
concurrency:
  group: synestra-r201-source-provenance
  cancel-in-progress: false
jobs:
  pinned-build-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: lab-babylon
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22 standard runner
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab-babylon/package-lock.json
      - name: Show immutable source provenance
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          git hash-object src/main.js src/core-volume.mjs src/core-shell-flow.mjs src/plasma-ribbons.js
      - name: Install exact lockfile without audit or funding calls
        run: npm ci --no-audit --no-fund
      - name: Complete full Labo Node regression suite (historical and R201 contracts)
        run: npm test
      - name: Build exactly checked-out R201 source
        run: |
          npm run build
          test -s dist/babylon-lab.js
          sha256sum dist/babylon-lab.js
          wc -c dist/babylon-lab.js
          git diff --exit-code -- src tests
      - name: Verify R201 source contract without changing files
        run: |
          grep -q 'visibleCoreMistCount' src/main.js
          grep -q 'core-shell-fusion-r201' src/main.js
          grep -q 'const mistBudget=visibleCoreMistCount' src/main.js
          echo "R201_EXACT_GITHUB_SOURCE_BUILD_PASS"
      - name: Emit immutable R201 gzip archive for GitHub handoff
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {gzipSync} from 'node:zlib';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const js=readFileSync('dist/babylon-lab.js');
          const expected='fe01472c48665f7759b8fb586f067b834b197359e63d0c28014fb2c17ff5d3f3';
          if(sha(js)!==expected || js.length!==7407057)throw Error('R201_WRONG_EXECUTABLE');
          const gz=gzipSync(js,{level:9,mtime:0});
          console.log('R201_ARCHIVE_META '+JSON.stringify({jsSha256:expected,jsBytes:js.length,archiveSha256:sha(gz),archiveBytes:gz.length}));
          console.log('R201_ARCHIVE_BASE64_BEGIN');
          const b64=gz.toString('base64');
          for(let i=0;i<b64.length;i+=4096)console.log('R201_B64:'+b64.slice(i,i+4096));
          console.log('R201_ARCHIVE_BASE64_END');
          NODE
