<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>SiteForge — Labo vierge · Sphère R116</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#050a14;color:#e7f4ff}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;padding:clamp(12px,3vw,30px);background:#050a14}
main{width:min(100%,920px);margin:0 auto}
h1{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:650;letter-spacing:.01em;margin:0 0 14px}
p{color:#9db3c8;font-size:.85rem;line-height:1.5;margin:13px 0 0}
.core-r108-stage{position:relative;isolation:isolate;overflow:hidden;height:clamp(395px,65svh,650px);border:1px solid rgba(129,186,231,.23);border-radius:23px;background:radial-gradient(ellipse 55% 60% at 50% 36%,rgba(33,62,119,.18),transparent 84%),linear-gradient(145deg,#0b1527,#050a14);box-shadow:0 30px 65px rgba(0,4,18,.29),inset 0 1px rgba(226,245,255,.08)}
.core-r109-canvas{position:absolute;top:0;left:0;z-index:2;display:block;width:100%;height:calc(100% - 58px);transform:scale(.49);transform-origin:center center;opacity:0;pointer-events:none;transition:opacity .5s ease}
.core-r109-stage[data-core-ready="true"] .core-r109-canvas{opacity:1}
.core-r108-art{position:absolute;left:50%;top:5%;transform:translateX(-50%) scale(.49);transform-origin:center center;width:min(100%,760px);height:350px;overflow:visible;pointer-events:none;transition:opacity .35s ease}
.core-r109-stage[data-core-ready="true"] .core-r108-art{opacity:0}
/* Mobile lab: the WebGL viewport stays in sight while the future controls scroll.
   Sticky is applied to the existing scene, not to its canvas: one GL context only. */
@media(max-width:700px){
 body{padding:12px 12px max(16px,env(safe-area-inset-bottom,0px))}
 .core-r108-stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  height:clamp(190px,34svh,290px);border-radius:16px;
  box-shadow:0 12px 30px rgba(0,4,18,.78),0 0 0 8px #050a14}
 .core-r109-canvas{height:100%;transform:scale(.66)}
 .core-r108-art{top:50%;transform:translate(-50%,-50%) scale(.66)}
}
@media(prefers-reduced-motion:reduce){.core-r109-canvas,.core-r108-art{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Sphère R116 <span aria-hidden="true">·</span> point de départ</h1>
<div class="core-r108-stage core-r109-stage" role="img" aria-label="Sphère énergétique Synestra R116, sans panneau de réglages ni gyroscope métallique.">
<canvas class="core-r109-canvas" width="960" height="570" aria-hidden="true"></canvas>
<svg class="core-r108-art" viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
<defs>
<radialGradient id="r108-aura"><stop offset="0" stop-color="#3c92ee" stop-opacity=".29"/><stop offset=".55" stop-color="#4340af" stop-opacity=".10"/><stop offset="1" stop-color="#111a2a" stop-opacity="0"/></radialGradient>
<radialGradient id="r108-plasma" cx=".34" cy=".25" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".14" stop-color="#c0ffff"/><stop offset=".36" stop-color="#51dfff"/><stop offset=".65" stop-color="#395bce"/><stop offset=".88" stop-color="#53318d"/><stop offset="1" stop-color="#08142e"/></radialGradient>
<filter id="r108-halo" x="-75%" y="-75%" width="250%" height="250%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<circle cx="320" cy="189" r="177" fill="url(#r108-aura)"/>
<circle cx="320" cy="189" r="103" fill="#31bdeb" opacity=".18" filter="url(#r108-halo)"/>
<circle cx="320" cy="189" r="86" fill="url(#r108-plasma)" stroke="#9beaff" stroke-width="1.25"/>
<path d="M267 150C287 125 318 121 339 132" stroke="#f2ffff" stroke-width="3" opacity=".56" fill="none" stroke-linecap="round"/>
<circle cx="289" cy="149" r="13" fill="#f5ffff" opacity=".23" filter="url(#r108-halo)"/>
</svg>
</div>
<p>Référence R116 d’origine. Aucun réglage, préréglage ou effet ajouté.</p>
</main>
<script src="../../assets/siteforge-r116-sphere-only.js" defer></script>
</body>
</html>
